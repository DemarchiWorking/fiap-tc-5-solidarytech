# Pipeline do donation-service.
#
# Arquivo fino de proposito: toda a logica vive em ci-servico.yml, reutilizado
# pelos tres servicos. Assim uma melhoria no scan de seguranca vale para todos
# ao mesmo tempo, em vez de precisar ser replicada em tres lugares.
name: CI — donation-service

on:
  push:
    branches: [main]
    paths:
      - "services/donation-service/**"
      - ".github/workflows/ci-donation.yml"
      - ".github/workflows/ci-servico.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/donation-service/**"
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci-servico.yml
    with:
      servico: donation-service
      linguagem: go
      caminho: services/donation-service
      overlay: gitops/apps/donation/overlays/prod
    secrets: inherit
