# Pipeline reutilizavel dos microsservicos — requisito F0.3 (CI/CD e DevSecOps).
#
# Um unico workflow para os tres servicos. Duplicar isso em tres arquivos quase
# iguais garantiria que eles divergissem: alguem melhora o scan em um e esquece
# dos outros, e a diferenca so aparece quando uma CVE passa pelo pipeline que
# ficou para tras.
#
# DAG dos jobs (mesma forma validada na Fase 4):
#
#     lint  ──┐
#             ├──▶  sast          (SonarCloud)
#     test  ──┤
#             └──▶  build-scan-push  ──▶  update-gitops
#
# lint e test rodam EM PARALELO: nao dependem um do outro e falhar cedo economiza
# minutos de runner. Os dois jobs seguintes dependem dos dois, entao um erro de
# lint ou um teste vermelho impede qualquer imagem de ser construida.

on:
  workflow_call:
    inputs:
      servico:
        description: "Nome do servico (ex.: donation-service)"
        required: true
        type: string
      linguagem:
        description: "go ou python"
        required: true
        type: string
      caminho:
        description: "Diretorio do servico"
        required: true
        type: string
      overlay:
        description: "Caminho do overlay no GitOps"
        required: true
        type: string

env:
  REGISTRY_REPO: solidarytech
  AWS_REGION: us-east-1

permissions:
  contents: write     # o job update-gitops faz commit
  security-events: write

jobs:
  # =========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A versao do Go/Python do runner muda sem aviso quando a imagem
      # ubuntu-latest e atualizada. Fixar aqui e o que impede a pipeline de
      # comecar a falhar sozinha num dia em que ninguem tocou no codigo.
      - uses: actions/setup-go@v5
        if: inputs.linguagem == 'go'
        with:
          go-version: "1.26"
          cache-dependency-path: ${{ inputs.caminho }}/go.sum

      - uses: actions/setup-python@v5
        if: inputs.linguagem == 'python'
        with:
          python-version: "3.12"

      - name: Go — golangci-lint
        if: inputs.linguagem == 'go'
        uses: golangci/golangci-lint-action@v8
        with:
          # Versao fixa, nao `latest`: cada release do golangci-lint liga
          # analisadores novos, e com `latest` a pipeline passa a reprovar
          # codigo que ninguem mudou. Atualizar vira uma decisao, com PR proprio.
          # v2.13.2 (08/2026). A v1 nao entende o export data do Go 1.26, e
          # a action v6 so fala com a v1 do linter — por isso as duas sobem
          # juntas. A v2 removeu as exclusoes embutidas do errcheck, o que
          # revelou quatro `defer x.Close()` sem tratamento; corrigidos.
          version: v2.13.2
          working-directory: ${{ inputs.caminho }}

      - name: Go — go.mod e go.sum consistentes
        if: inputs.linguagem == 'go'
        working-directory: ${{ inputs.caminho }}
        run: |
          # `go mod tidy` seguido de diff detecta dependencia declarada e nao
          # usada, ou usada e nao declarada. E tambem uma defesa de supply
          # chain: um go.sum divergente do go.mod indica que alguem mexeu nas
          # somas de verificacao.
          go mod tidy
          # `git diff` so compara arquivos RASTREADOS. Enquanto o go.sum nao
          # estiver commitado (ver `make gerar-gosum`), o tidy o cria como
          # arquivo novo e o diff passaria sem sequer olhar para ele. O
          # ls-files abaixo transforma essa ausencia em erro explicito.
          if ! git ls-files --error-unmatch go.sum >/dev/null 2>&1; then
            echo "::error::go.sum nao esta versionado. Rode 'make gerar-gosum' e commite go.mod e go.sum."
            exit 1
          fi
          git diff --exit-code go.mod go.sum

      - name: Python — ruff
        if: inputs.linguagem == 'python'
        working-directory: ${{ inputs.caminho }}
        run: |
          # Versao fixa, pelo mesmo motivo do gosec e do bandit logo abaixo.
          # Sem ela o gate depende do calendario de release de terceiro: a 0.16
          # ligou G201, BLE001, FURB157 e RUF100 no conjunto padrao, e a
          # pipeline passou a reprovar codigo que ninguem tinha tocado.
          pip install --quiet ruff==0.16.6
          ruff check .

  # =========================================================================
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: inputs.linguagem == 'go'
        with:
          go-version: "1.26"
          cache-dependency-path: ${{ inputs.caminho }}/go.sum

      - uses: actions/setup-python@v5
        if: inputs.linguagem == 'python'
        with:
          python-version: "3.12"
          cache: pip

      - name: Go — testes com deteccao de corrida
        if: inputs.linguagem == 'go'
        working-directory: ${{ inputs.caminho }}
        run: |
          # -race e obrigatorio aqui: o donation-service publica em SQS dentro
          # de uma goroutine, e corrida de dados nesse caminho corromperia o
          # evento de doacao em producao sem estourar erro nenhum.
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1

      - name: Python — pytest com cobertura
        if: inputs.linguagem == 'python'
        working-directory: ${{ inputs.caminho }}
        run: |
          pip install --quiet -r requirements.txt -r requirements-dev.txt
          python -m pytest -v --cov=. --cov-report=xml --cov-report=term

      - name: Publicar a cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ inputs.servico }}
          path: |
            ${{ inputs.caminho }}/coverage.out
            ${{ inputs.caminho }}/coverage.xml
          if-no-files-found: warn

  # =========================================================================
  sast:
    name: SAST (gosec/bandit + SonarCloud)
    needs: [lint, test]
    runs-on: ubuntu-latest

    # SONAR_TOKEN no escopo do JOB, e nao no do step.
    #
    # Antes o `if: env.SONAR_TOKEN != ''` estava no proprio step que declarava
    # `env: SONAR_TOKEN`. O `if` de um step e avaliado ANTES do `env` daquele
    # step existir, entao a expressao lia uma variavel vazia e dava sempre
    # falso: o SonarCloud NUNCA rodou, e mesmo assim o job aparecia verde no
    # painel. Metade da evidencia do requisito F0.3b (SAST) nao existia.
    #
    # Declarado aqui, o valor entra no contexto `env` do job e o `if` do step
    # passa a enxerga-lo — mantendo o comportamento pretendido de PULAR (e nao
    # falhar) quando um fork nao tem o segredo configurado. Continua sendo um
    # `if` de step, e nao de job, porque o contexto `secrets` nao esta
    # disponivel em `jobs.<id>.if`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # O `if` do step do Sonar continua condicional ao segredo — mas agora
    # isso nao deixa mais o job sem SAST nenhum: gosec e bandit rodam antes,
    # incondicionalmente.
    #
    # `if: !cancelled()` foi REMOVIDO: com ele o SAST rodava mesmo apos lint ou
    # teste vermelhos, gastando runner para analisar codigo que ja se sabia
    # quebrado. O comportamento padrao de `needs` — so roda se as dependencias
    # passarem — e o correto aqui.
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0: o Sonar precisa do historico para atribuir cada
          # problema ao commit que o introduziu (analise de "new code").
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: cobertura-${{ inputs.servico }}
          path: ${{ inputs.caminho }}
        continue-on-error: true
      # -------------------------------------------------------------------
      # SAST QUE SEMPRE RODA — nao depende de conta em servico externo.
      #
      # O SonarCloud abaixo e PULADO quando falta SONAR_TOKEN. Isso e proposital
      # (um fork sem a integracao ainda roda o resto), mas tinha um efeito que
      # nao era: a pipeline inteira podia passar sem NENHUMA analise estatica, e
      # o job aparecia verde. Na Fase 3 o SAST era incondicional — era uma
      # regressao silenciosa do requisito F0.3b.
      #
      # gosec e bandit rodam localmente, sem token nenhum, e barram severidade
      # ALTA. O Sonar continua como reforco: cobertura, code smells e analise de
      # "new code" que estas duas ferramentas nao fazem.
      # -------------------------------------------------------------------
      - uses: actions/setup-go@v5
        if: inputs.linguagem == 'go'
        with:
          go-version: "1.26"
          cache-dependency-path: ${{ inputs.caminho }}/go.sum

      - name: Go — gosec
        if: inputs.linguagem == 'go'
        working-directory: ${{ inputs.caminho }}
        run: |
          # Versao fixa: cada release do gosec liga regras novas, e com @latest
          # a pipeline passaria a reprovar codigo que ninguem mudou.
          #
          # Mas versao fixa tambem envelhece contra o COMPILADOR. A v2.21.4
          # depende de golang.org/x/tools@v0.25.0, cujo tokeninternal.go usa um
          # truque que o Go 1.26 rejeita:
          #
          #   invalid array length -delta * delta (constant -256 of type int64)
          #
          # O `go install` falhava antes de o gosec analisar uma linha sequer —
          # o job de SAST reprovava sem que houvesse nenhum achado. Ao subir a
          # versao do Go aqui, esta linha tem de subir junto.
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          # -severity high: barra o que e explorevel. MEDIUM entra no relatorio
          # sem travar a entrega — mesma politica do Trivy, pelo mesmo motivo:
          # gate que trava por tudo e gate que alguem desliga.
          gosec -severity high -confidence medium -fmt text ./...

      - uses: actions/setup-python@v5
        if: inputs.linguagem == 'python'
        with:
          python-version: "3.12"

      - name: Python — bandit
        if: inputs.linguagem == 'python'
        working-directory: ${{ inputs.caminho }}
        run: |
          pip install --quiet bandit==1.8.0
          # -lll: so severidade alta reprova. Os testes ficam de fora: `assert`
          # em teste e o esperado, e o bandit o classifica como B101.
          bandit -r . -lll --exclude ./test_app.py,./test_worker.py,./conftest.py


      - name: SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.caminho }}
          args: >
            -Dsonar.projectKey=solidarytech-${{ inputs.servico }}
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/test_*.py,**/conftest.py
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.python.coverage.reportPaths=coverage.xml

  # =========================================================================
  build-scan-push:
    name: Build, scan e push
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # CAMADA 1 de seguranca — SCA no codigo-fonte, ANTES do build.
      #
      # Analisa go.mod/go.sum e requirements.txt. Pega vulnerabilidade de
      # DEPENDENCIA sem precisar construir a imagem: falha em ~20s em vez de
      # depois de um build de varios minutos.
      # ---------------------------------------------------------------
      # O comentario original dizia "apenas CRITICAL bloqueia", mas a
      # configuracao era `severity: CRITICAL,HIGH` com `exit-code: 1` — ou
      # seja, HIGH tambem barrava. A politica descrita e a implementada eram
      # diferentes, e a implementada e a que para a entrega na vespera da
      # apresentacao. Separado em dois passos, cada um fazendo o que o nome diz.
      # A tag do trivy-action ganhou prefixo `v` em algum momento: a `0.28.0`
      # sem prefixo deixou de existir no repositorio da acao. Uma referencia
      # que nao resolve falha em "Set up job" — antes de qualquer passo rodar,
      # e sem dizer qual acao e a culpada. Foi o que reprovou este job nas tres
      # pipelines, com lint, teste e SAST todos verdes acima.
      - name: Trivy — dependencias (SCA) — relatorio HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.caminho }}
          severity: HIGH
          exit-code: "0"          # informativo: aparece no log, nao trava
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Trivy — dependencias (SCA) — gate CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.caminho }}
          severity: CRITICAL
          # So CRITICAL barra. Com HIGH bloqueando, qualquer CVE nova em
          # dependencia transitiva pararia o time, e a reacao previsivel seria
          # desligar o scan — pior do que um scan que so barra o critico.
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      # ---------------------------------------------------------------
      - name: Build da imagem
        run: |
          docker build \
            --target runtime \
            --build-arg VERSION=${{ github.sha }} \
            -t ${{ inputs.servico }}:${{ github.sha }} \
            ${{ inputs.caminho }}

      - name: Rodar a suite dentro da imagem
        # Estagio `test` do Dockerfile. Garante que os testes passem no MESMO
        # ambiente da imagem final — versao de runtime, libs de sistema e locale
        # incluidos. Teste que so passa no runner e teste que mente.
        run: docker build --target test ${{ inputs.caminho }}

      # ---------------------------------------------------------------
      # CAMADA 2 de seguranca — scan da IMAGEM construida.
      #
      # Complementa a camada 1: aqui entram os pacotes do sistema operacional
      # base (Debian/Alpine), que o scan de filesystem nao enxerga.
      # ---------------------------------------------------------------
      - name: Trivy — imagem (gate CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.servico }}:${{ github.sha }}
          # Mesma politica do scan de dependencias, pelo mesmo motivo. O HIGH
          # nao se perde: o SARIF do passo seguinte leva CRITICAL, HIGH e
          # MEDIUM para a aba Security do GitHub.
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy — relatorio SARIF para o GitHub Security
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: ${{ inputs.servico }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM

      # v4: a v3 do codeql-action entrou em fim de vida — ainda resolve, mas
      # passa a avisar e depois a falhar. Trocar agora evita repetir a licao
      # da trivy-action, que so apareceu quando a tag antiga sumiu.
      - name: Enviar ao GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ inputs.servico }}
        continue-on-error: true

      # ---------------------------------------------------------------
      - name: SBOM (CycloneDX)
        # Inventario assinavel de tudo que existe na imagem. Quando a proxima
        # Log4Shell aparecer, a pergunta "estamos expostos?" se responde
        # consultando o SBOM, e nao reconstruindo imagem por imagem.
        uses: anchore/sbom-action@v0
        with:
          image: ${{ inputs.servico }}:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-${{ inputs.servico }}.json

      # ---------------------------------------------------------------
      # PUSH — so a partir da main, e nunca em pull request.
      # ---------------------------------------------------------------
      - name: Credenciais AWS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # SEM OIDC. A federacao OIDC seria o caminho correto (nenhum segredo
          # armazenado), mas exige criar um aws_iam_openid_connect_provider —
          # bloqueado no AWS Academy Learner Lab.
          #
          # Restam as credenciais da sessao, que JA SAO temporarias e expiram em
          # ~4h junto com o lab. Renovadas por `make sync-creds` a cada sessao.
          # A limitacao e a mitigacao estao documentadas em docs/06-dr-pcn/.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGEM="${REGISTRY}/${REGISTRY_REPO}/${{ inputs.servico }}"
          docker tag ${{ inputs.servico }}:${{ github.sha }} "${IMAGEM}:${{ github.sha }}"
          # Apenas a tag com SHA. O repositorio ECR e IMMUTABLE, entao um
          # `:latest` movel seria rejeitado — e e justamente esse o ponto: a tag
          # implantada corresponde SEMPRE ao codigo daquele commit, o que
          # sustenta a premissa do GitOps.
          docker push "${IMAGEM}:${{ github.sha }}"
          echo "Publicado: ${IMAGEM}:${{ github.sha }}"

  # =========================================================================
  update-gitops:
    name: Atualizar o GitOps
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Uma pipeline por vez alterando o repositorio GitOps: dois jobs commitando
    # em paralelo causariam rejeicao de push por non-fast-forward.
    concurrency:
      group: gitops-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # fetch-depth: 0 por causa do `git pull --rebase origin main` mais
          # abaixo: num clone raso (o padrao, depth 1) o rebase nao encontra
          # ancestral comum e falha — justamente quando duas pipelines correm
          # juntas, que e o unico cenario em que aquele rebase importa.
          fetch-depth: 0

      - name: Instalar o kustomize
        run: |
          curl -sfLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz && sudo mv kustomize /usr/local/bin/

      - name: Fixar a tag da imagem
        working-directory: ${{ inputs.overlay }}
        run: |
          set -euo pipefail

          # Lê o `newName` que `make configurar-repo` já gravou (o registry ECR
          # real da conta) e troca APENAS a tag. Assim a pipeline nunca precisa
          # conhecer o ID da conta AWS — que, aliás, muda a cada aluno do grupo.
          REGISTRY=$(awk '/name: ${{ inputs.servico }}$/{achou=1} achou && /newName:/{print $2; exit}' kustomization.yaml)

          if [[ -z "$REGISTRY" ]]; then
            echo "::error::newName não encontrado em kustomization.yaml."
            echo "::error::Rode 'make configurar-repo' e faça commit antes do primeiro deploy."
            exit 1
          fi

          # O repositorio e publicado com um placeholder no lugar do registry,
          # que `make configurar-repo` troca pelo valor real da conta. Se alguem
          # pular esse passo, sem esta guarda a pipeline gravaria
          # "<placeholder>:<sha>" no GitOps e o ArgoCD ficaria em
          # ImagePullBackOff — um erro que aparece longe daqui e custa caro
          # para rastrear ate a origem.
          #
          # O nome do placeholder e montado em DUAS PARTES de proposito. Escrito
          # inteiro, ele era substituido pelo proprio `configurar-repo.sh`, que
          # varria .github/ junto com gitops/. O literal virava o host do ECR e
          # a condicao abaixo ficava sempre verdadeira: este job falhava em toda
          # execucao. O script ja nao varre .github/, mas o sentinela partido
          # torna a classe de erro impossivel de voltar.
          SENTINELA="__ECR""_REGISTRY__"
          if [[ "$REGISTRY" == *"$SENTINELA"* ]]; then
            echo "::error::kustomization.yaml ainda contem o placeholder do registry."
            echo "::error::Rode 'make configurar-repo' e faça commit antes do primeiro deploy."
            exit 1
          fi

          kustomize edit set image "${{ inputs.servico }}=${REGISTRY}:${{ github.sha }}"
          echo "Imagem fixada: ${REGISTRY}:${{ github.sha }}"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.overlay }}
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca — a imagem ja estava nesta versao."
            exit 0
          fi
          git commit -m "deploy(${{ inputs.servico }}): ${{ github.sha }}

          Atualizacao automatica da tag da imagem pela pipeline de CI.
          O ArgoCD sincroniza a partir deste commit.

          Origem: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          # Rebase antes do push: outra pipeline pode ter commitado no intervalo.
          git pull --rebase origin main
          git push
