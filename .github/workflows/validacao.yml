# Gates que rodam SEM nuvem, SEM credencial e SEM gastar crédito.
#
# São os mesmos que `make check` executa localmente. Ficam em CI porque a
# disciplina de rodar o gate antes de commitar nunca sobrevive a um prazo
# apertado — e é justamente sob prazo apertado que os erros entram.
#
# Roda em TODO push e TODO PR. Rápido de propósito: se demorar, o time começa a
# esperar o resultado depois do merge, e o gate perde a função.

name: Validação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Gates locais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install --quiet pyyaml

      # ---------------------------------------------------------------
      - name: AWS Academy — recursos bloqueados no Terraform
        # Verifica criação de IAM, Spot, RDS Multi-AZ, Performance Insights,
        # Enhanced Monitoring, IRSA, região fora da lista, instância acima do
        # teto, escape HCL inválido e segredo literal.
        run: python scripts/verificar-academy.py infra

      # ---------------------------------------------------------------
      - name: Observabilidade — coerência entre dashboards, regras e código
        # O mais sutil dos gates: se os buckets do histograma divergirem entre
        # Go e Python, o histogram_quantile mistura fronteiras diferentes e o
        # p95 do SLO passa a mentir — sem erro, sem log, sem sintoma.
        run: python scripts/verificar-observabilidade.py .

      # ---------------------------------------------------------------
      - name: Contrato PromQL x código
        run: python scripts/verificar-promql.py .

      # promtool e amtool validam a SINTAXE; o gate acima valida o CONTRATO.
      # Sao coisas diferentes e as duas importam: uma expressao pode ser PromQL
      # impecavel e citar uma metrica que ninguem emite — o Prometheus carrega
      # sem reclamar e a serie nunca aparece.
      - name: Instalar promtool e amtool
        run: |
          curl -sfL https://github.com/prometheus/prometheus/releases/download/v3.6.0/prometheus-3.6.0.linux-amd64.tar.gz | tar -xz
          curl -sfL https://github.com/prometheus/alertmanager/releases/download/v0.28.1/alertmanager-0.28.1.linux-amd64.tar.gz | tar -xz
          sudo mv prometheus-3.6.0.linux-amd64/promtool alertmanager-0.28.1.linux-amd64/amtool /usr/local/bin/

      - name: PromQL das regras e dos painéis
        run: |
          set -euo pipefail
          python - <<'PY'
          # As regras vivem em PrometheusRule (CRD); o promtool espera um
          # arquivo de regras puro, com `groups` na raiz.
          import io, json, os, yaml
          os.makedirs("regras-extraidas", exist_ok=True)
          for arq in ("gitops/addons/observabilidade-config/slo-rules.yaml",
                      "gitops/addons/observabilidade-config/alertas-plataforma.yaml"):
              for doc in yaml.safe_load_all(io.open(arq, encoding="utf-8")):
                  if isinstance(doc, dict) and doc.get("kind") == "PrometheusRule":
                      nome = doc["metadata"]["name"]
                      io.open(f"regras-extraidas/{nome}.yaml", "w", encoding="utf-8").write(
                          yaml.safe_dump({"groups": doc["spec"]["groups"]},
                                         sort_keys=False, allow_unicode=True))

          # As expressoes dos paineis viram regras sinteticas, uma por arquivo.
          exprs = []
          for arq in ("gitops/addons/observabilidade-config/dashboard-sre.yaml",
                      "gitops/addons/observabilidade-config/dashboard-finops.yaml"):
              for doc in yaml.safe_load_all(io.open(arq, encoding="utf-8")):
                  if not isinstance(doc, dict) or doc.get("kind") != "ConfigMap":
                      continue
                  for valor in (doc.get("data") or {}).values():
                      for p in json.loads(valor).get("panels", []):
                          for t in p.get("targets", []):
                              if t.get("expr"):
                                  exprs.append((p.get("title", "painel"), t["expr"]))
          for i, (titulo, e) in enumerate(exprs):
              io.open(f"regras-extraidas/painel-{i:02d}.yaml", "w", encoding="utf-8").write(
                  yaml.safe_dump({"groups": [{"name": "painel",
                                              "rules": [{"record": "painel:teste", "expr": e}]}]},
                                 sort_keys=False, allow_unicode=True))
          print(f"{len(exprs)} expressao(oes) de painel extraida(s)")
          PY
          promtool check rules regras-extraidas/*.yaml

      - name: Config do Alertmanager
        run: |
          python - <<'PY'
          import io, yaml
          v = yaml.safe_load(io.open("gitops/addons/kube-prometheus-stack/values.yaml", encoding="utf-8"))
          io.open("am.yaml", "w", encoding="utf-8").write(
              yaml.safe_dump(v["alertmanager"]["config"], sort_keys=False, allow_unicode=True))
          PY
          amtool check-config am.yaml

      - name: Sintaxe YAML
        run: |
          python - <<'PY'
          import io, os, sys, yaml
          erros = total = 0
          for d, _, fs in os.walk("."):
              # Comparar COMPONENTES do caminho, e nao substring. O filtro
              # anterior era `".git" in d`, e ".git" e substring de
              # ".github": o diretorio de workflows inteiro escapava da
              # validacao. Os oito arquivos de pipeline — os que mais
              # dependem de YAML correto — nunca foram conferidos por este
              # gate. `.venv` e `node_modules` entram na lista pelo motivo
              # original: sao arvores grandes que nao sao nossas.
              partes = set(d.split(os.sep))
              if partes & {".git", ".venv", "node_modules", "__pycache__"}:
                  continue
              for f in fs:
                  if not f.endswith((".yaml", ".yml")): continue
                  p = os.path.join(d, f)
                  try:
                      list(yaml.safe_load_all(io.open(p, encoding="utf-8")))
                      total += 1
                  except yaml.YAMLError as e:
                      print(f"FALHA {p}: {str(e).splitlines()[0]}")
                      erros += 1
          print(f"{total} arquivos YAML válidos, {erros} com erro")
          sys.exit(1 if erros else 0)
          PY

      # ---------------------------------------------------------------
      - name: Links da documentação
        # Documentação com link quebrado é documentação que ninguém confere — e
        # este projeto usa a documentação como evidência de nota.
        run: |
          python - <<'PY'
          import io, os, re, sys
          quebrados = []
          for d, _, fs in os.walk("."):
              # Comparar COMPONENTES do caminho, e nao substring. O filtro
              # anterior era `".git" in d`, e ".git" e substring de
              # ".github": o diretorio de workflows inteiro escapava da
              # validacao. Os oito arquivos de pipeline — os que mais
              # dependem de YAML correto — nunca foram conferidos por este
              # gate. `.venv` e `node_modules` entram na lista pelo motivo
              # original: sao arvores grandes que nao sao nossas.
              partes = set(d.split(os.sep))
              if partes & {".git", ".venv", "node_modules", "__pycache__"}:
                  continue
              for f in fs:
                  if not f.endswith(".md"): continue
                  p = os.path.join(d, f)
                  txt = io.open(p, encoding="utf-8").read()
                  for m in re.finditer(r"\]\(([^)#][^)]*?)\)", txt):
                      alvo = m.group(1).split("#")[0].strip()
                      if not alvo or alvo.startswith(("http", "mailto:", "<")): continue
                      if not os.path.exists(os.path.normpath(os.path.join(d, alvo))):
                          quebrados.append(f"{p} -> {alvo}")
          for q in quebrados: print("FALHA", q)
          print(f"{len(quebrados)} link(s) quebrado(s)")
          sys.exit(1 if quebrados else 0)
          PY

  # =========================================================================
  manifestos:
    name: Manifestos Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Referências a documentos fora do Markdown
        run: |
          python - <<'PY'
          # Caça ponteiros para docs/*.md escritos em COMENTÁRIOS de YAML, HCL
          # e shell.
          #
          # O verificador de links acima só lê arquivos .md, então uma linha
          # como
          #
          #     # A tabela antes/depois está em docs/04-finops/<arquivo>.md
          #
          # dentro de um deployment.yaml passava sem ninguém conferir. Foi
          # exatamente o que aconteceu: dois arquivos apontavam para um
          # arquivo que nunca existiu — o conteúdo estava no README.md
          # da mesma pasta. Quem avaliasse o requisito F2.2 seguindo o ponteiro
          # do manifesto não encontraria a evidência.
          #
          # Comentário desatualizado é barato de escrever e caro de detectar;
          # este é o subconjunto que dá para verificar de graça.
          import io, os, re, sys

          EXTENSOES = (".yaml", ".yml", ".tf", ".sh", ".go", ".py", ".json")
          quebrados = []
          vistos = 0

          for d, _, fs in os.walk("."):
              partes = set(d.split(os.sep))
              if partes & {".git", ".venv", "node_modules", "__pycache__", ".terraform"}:
                  continue
              for f in fs:
                  if not f.endswith(EXTENSOES):
                      continue
                  p = os.path.join(d, f)
                  try:
                      txt = io.open(p, encoding="utf-8").read()
                  except (OSError, UnicodeDecodeError):
                      continue
                  # Caminhos de documentação referenciados em texto livre.
                  for m in re.finditer(r"\b(docs/[\w./-]+\.md)\b", txt):
                      vistos += 1
                      alvo = m.group(1)
                      if not os.path.exists(alvo):
                          linha = txt[: m.start()].count("\n") + 1
                          quebrados.append(f"{p}:{linha} -> {alvo}")

          # Segundo passo: caminhos do repositorio escritos entre CRASES, em Markdown.
          #
          # O passo acima so olha `docs/*.md` em texto livre, e por isso deixou passar
          # cinco ponteiros mortos — entre eles a matriz de requisitos apontando para um
          # "ADR-007-multicloud.md" que nunca existiu (o ADR-007 vive dentro do README da
          # pasta) e para um arquivo de evidencia com outro nome. Quem avaliasse o
          # requisito seguindo o ponteiro nao encontraria nada.
          #
          # Caminho entre crases e a forma mais comum de citar arquivo em documentacao
          # tecnica, e era justamente a que ninguem verificava.
          PREFIXOS = r"(?:docs|infra|gitops|scripts|services|\.github)"
          EXTENSOES = r"(?:md|yaml|yml|tf|sh|py|go|json)"
          PADRAO = "`(" + PREFIXOS + r"/[\w./*-]+\." + EXTENSOES + ")`"

          for d, _, fs in os.walk("."):
              partes = set(d.split(os.sep))
              if partes & {".git", ".venv", "node_modules", "__pycache__", ".terraform"}:
                  continue
              for f in fs:
                  if not f.endswith(".md"):
                      continue
                  p = os.path.join(d, f)
                  try:
                      txt = io.open(p, encoding="utf-8").read()
                  except (OSError, UnicodeDecodeError):
                      continue
                  for m in re.finditer(PADRAO, txt):
                      alvo = m.group(1)
                      if "*" in alvo:      # glob e ilustrativo, nao e ponteiro
                          continue
                      vistos += 1
                      if not os.path.exists(alvo):
                          linha = txt[: m.start()].count("\n") + 1
                          quebrados.append(f"{p}:{linha} -> {alvo} (entre crases)")

          print(f"{vistos} referência(s) a arquivos do repositório")
          for q in quebrados:
              print(f"  QUEBRADA: {q}")
          sys.exit(1 if quebrados else 0)
          PY
      # UMA fonte de verdade: o mesmo script que roda na maquina.
      #
      # Estes tres passos — instalar as ferramentas, rodar kustomize+kubeconform
      # e conferir a politica de Deployment — eram uma COPIA da logica de
      # scripts/verificar-manifestos.sh, embutida aqui. A copia envelheceu: a
      # checagem de politica ainda procurava as marcacoes como TEXTO no arquivo
      # inteiro, entao tratava os tres hpa.yaml como Deployments (um
      # HorizontalPodAutoscaler contem `scaleTargetRef: kind: Deployment`) e
      # produzia 21 falsos positivos.
      #
      # Ou seja: este workflow reprovava em toda execucao, por um bug que ja
      # tinha sido corrigido no script. Duplicar logica de verificacao custa
      # exatamente isso — as duas copias divergem, e a que ninguem olha e a que
      # apita.
      #
      # O script tambem ja prefere binario nativo e cai para container so se
      # precisar, entao roda igual aqui e na maquina de quem desenvolve.
      - name: Instalar kustomize e kubeconform
        run: |
          curl -sfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | tar -xz
          curl -sfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kustomize kubeconform /usr/local/bin/

      - name: Manifestos — kustomize, kubeconform e política
        run: bash scripts/verificar-manifestos.sh

  testes:
    name: Testes dos serviços
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - servico: ngo-service
            linguagem: python
          - servico: volunteer-service
            linguagem: python
          - servico: donation-service
            linguagem: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.linguagem == 'python'
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        if: matrix.linguagem == 'go'
        with:
          go-version: "1.26"
          cache-dependency-path: services/${{ matrix.servico }}/go.sum

      - name: Testes Python
        if: matrix.linguagem == 'python'
        working-directory: services/${{ matrix.servico }}
        run: |
          pip install --quiet -r requirements.txt -r requirements-dev.txt
          python -m pytest -v --cov=. --cov-report=term

      - name: Testes Go
        if: matrix.linguagem == 'go'
        working-directory: services/${{ matrix.servico }}
        run: |
          go mod tidy
          go vet ./...
          # -race: o donation-service publica em SQS dentro de uma goroutine, e
          # corrida de dados nesse caminho corromperia o evento de doação em
          # produção sem estourar erro nenhum.
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
