<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Arquitetura SolidaryTech na AWS</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d5a73"/>
    </marker>
    <marker id="setaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>

  <!-- Faixa de entrega: GitHub -> ECR -> ArgoCD -->
  <rect x="20" y="16" width="960" height="92" rx="8" fill="#f4f8fb" stroke="#b9c9d8"/>
  <text x="34" y="36" font-size="12" font-weight="700" fill="#0b2545">ENTREGA — nenhum deploy manual</text>
  <rect x="34" y="46" width="170" height="48" rx="6" fill="#ffffff" stroke="#3d5a73"/>
  <text x="119" y="66" font-size="12" font-weight="600" text-anchor="middle" fill="#0b2545">GitHub (código + GitOps)</text>
  <text x="119" y="82" font-size="10" text-anchor="middle" fill="#4a5a6a">push na main</text>
  <rect x="244" y="46" width="250" height="48" rx="6" fill="#ffffff" stroke="#3d5a73"/>
  <text x="369" y="64" font-size="12" font-weight="600" text-anchor="middle" fill="#0b2545">GitHub Actions — DevSecOps</text>
  <text x="369" y="80" font-size="9" text-anchor="middle" fill="#4a5a6a">lint ‖ testes → gosec/bandit → Trivy fs + imagem → SBOM</text>
  <rect x="534" y="46" width="150" height="48" rx="6" fill="#ffffff" stroke="#3d5a73"/>
  <text x="609" y="66" font-size="12" font-weight="600" text-anchor="middle" fill="#0b2545">Amazon ECR</text>
  <text x="609" y="82" font-size="10" text-anchor="middle" fill="#4a5a6a">tag = SHA · IMMUTABLE</text>
  <rect x="724" y="46" width="240" height="48" rx="6" fill="#ffffff" stroke="#3d5a73"/>
  <text x="844" y="64" font-size="12" font-weight="600" text-anchor="middle" fill="#0b2545">ArgoCD (App-of-Apps)</text>
  <text x="844" y="80" font-size="10" text-anchor="middle" fill="#4a5a6a">lê o Git · selfHeal · prune</text>
  <line x1="204" y1="70" x2="242" y2="70" stroke="#3d5a73" stroke-width="1.6" marker-end="url(#seta)"/>
  <line x1="494" y1="70" x2="532" y2="70" stroke="#3d5a73" stroke-width="1.6" marker-end="url(#seta)"/>
  <line x1="684" y1="70" x2="722" y2="70" stroke="#3d5a73" stroke-width="1.6" marker-end="url(#seta)"/>

  <!-- Regiao primaria -->
  <rect x="20" y="124" width="700" height="496" rx="10" fill="#fbfcfe" stroke="#0b2545" stroke-width="1.5"/>
  <text x="36" y="146" font-size="13" font-weight="700" fill="#0b2545">AWS us-east-1 — produção · 100% Terraform · tags Project / Environment / CostCenter</text>

  <!-- Entrada -->
  <rect x="40" y="160" width="660" height="40" rx="6" fill="#eef2f7" stroke="#8aa2b8"/>
  <text x="370" y="185" font-size="12" text-anchor="middle" fill="#0b2545">Internet → NLB → ingress-nginx  ·  /ngo  /donations  /volunteers  /grafana  /argocd</text>

  <!-- EKS -->
  <rect x="40" y="214" width="660" height="262" rx="8" fill="#ffffff" stroke="#3d7ea6" stroke-width="1.4"/>
  <text x="54" y="234" font-size="12" font-weight="700" fill="#14406e">Amazon EKS 1.34 — 3 × t3.medium ON_DEMAND · LabRole (sem IAM criado)</text>

  <rect x="56" y="246" width="190" height="72" rx="6" fill="#eaf4ee" stroke="#1f7a4d"/>
  <text x="151" y="268" font-size="12" font-weight="700" text-anchor="middle" fill="#14532d">donation-service</text>
  <text x="151" y="284" font-size="10" text-anchor="middle" fill="#14532d">Go · HOT PATH · HPA 2–10</text>
  <text x="151" y="300" font-size="10" text-anchor="middle" fill="#14532d">SLO 99,9% · p95 &lt; 300 ms</text>

  <rect x="262" y="246" width="190" height="72" rx="6" fill="#ffffff" stroke="#3d5a73"/>
  <text x="357" y="268" font-size="12" font-weight="700" text-anchor="middle" fill="#0b2545">ngo-service</text>
  <text x="357" y="284" font-size="10" text-anchor="middle" fill="#4a5a6a">Python/Flask · HPA</text>
  <text x="357" y="300" font-size="10" text-anchor="middle" fill="#4a5a6a">cadastro de ONGs</text>

  <rect x="468" y="246" width="216" height="72" rx="6" fill="#ffffff" stroke="#3d5a73"/>
  <text x="576" y="268" font-size="12" font-weight="700" text-anchor="middle" fill="#0b2545">volunteer-service + worker</text>
  <text x="576" y="284" font-size="10" text-anchor="middle" fill="#4a5a6a">Python · worker consome SQS</text>
  <text x="576" y="300" font-size="10" text-anchor="middle" fill="#4a5a6a">HPA no produtor e no consumidor</text>

  <rect x="56" y="334" width="628" height="58" rx="6" fill="#f6f2fb" stroke="#6b4fa0"/>
  <text x="370" y="354" font-size="12" font-weight="700" text-anchor="middle" fill="#3f2a6b">Observabilidade — OpenTelemetry Collector (gateway + logs)</text>
  <text x="370" y="372" font-size="10.5" text-anchor="middle" fill="#3f2a6b">Prometheus → Grafana (SRE / Error Budget · FinOps)  ·  Loki (logs, S3)  ·  Datadog APM + Watchdog (AIOps)</text>
  <text x="370" y="386" font-size="10" text-anchor="middle" fill="#3f2a6b">trace_id correlaciona APM ↔ log · alertas de burn rate → Alertmanager</text>

  <rect x="56" y="404" width="300" height="56" rx="6" fill="#ffffff" stroke="#3d5a73"/>
  <text x="206" y="424" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0b2545">Plataforma</text>
  <text x="206" y="440" font-size="10" text-anchor="middle" fill="#4a5a6a">metrics-server · OpenCost · Velero · NetworkPolicies</text>
  <text x="206" y="453" font-size="10" text-anchor="middle" fill="#4a5a6a">PDB · probes · non-root · IMDSv2</text>

  <rect x="372" y="404" width="312" height="56" rx="6" fill="#fff8ec" stroke="#b7791f"/>
  <text x="528" y="424" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7a4d0b">Resposta a incidente</text>
  <text x="528" y="440" font-size="10" text-anchor="middle" fill="#7a4d0b">ChatOps · PagerDuty · self-heal (allowlist)</text>
  <text x="528" y="453" font-size="10" text-anchor="middle" fill="#7a4d0b">runbook por alerta · post-mortem blameless</text>

  <!-- Dados -->
  <rect x="40" y="490" width="660" height="116" rx="8" fill="#ffffff" stroke="#3d5a73"/>
  <text x="54" y="510" font-size="12" font-weight="700" fill="#0b2545">Dados e mensageria — subnets privadas, cifrado em repouso</text>
  <rect x="56" y="522" width="150" height="70" rx="6" fill="#eef2f7" stroke="#8aa2b8"/>
  <text x="131" y="545" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0b2545">RDS PostgreSQL</text>
  <text x="131" y="561" font-size="10" text-anchor="middle" fill="#4a5a6a">db.t3.micro · PITR</text>
  <text x="131" y="575" font-size="10" text-anchor="middle" fill="#4a5a6a">senha no Secrets Mgr</text>
  <rect x="220" y="522" width="150" height="70" rx="6" fill="#eef2f7" stroke="#8aa2b8"/>
  <text x="295" y="545" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0b2545">SQS + DLQ</text>
  <text x="295" y="561" font-size="10" text-anchor="middle" fill="#4a5a6a">doação confirmada</text>
  <text x="295" y="575" font-size="10" text-anchor="middle" fill="#4a5a6a">antes de notificar</text>
  <rect x="384" y="522" width="150" height="70" rx="6" fill="#eef2f7" stroke="#8aa2b8"/>
  <text x="459" y="545" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0b2545">DynamoDB</text>
  <text x="459" y="561" font-size="10" text-anchor="middle" fill="#4a5a6a">voluntários · GSI</text>
  <text x="459" y="575" font-size="10" text-anchor="middle" fill="#4a5a6a">on-demand</text>
  <rect x="548" y="522" width="136" height="70" rx="6" fill="#eef2f7" stroke="#8aa2b8"/>
  <text x="616" y="545" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0b2545">S3 (Loki)</text>
  <text x="616" y="561" font-size="10" text-anchor="middle" fill="#4a5a6a">VPC endpoints</text>
  <text x="616" y="575" font-size="10" text-anchor="middle" fill="#4a5a6a">gateway (grátis)</text>

  <!-- ArgoCD aplica no cluster -->
  <path d="M844,94 L844,112 L690,112 L690,212" fill="none" stroke="#3d5a73" stroke-width="1.6" marker-end="url(#seta)"/>

  <!-- Regiao DR -->
  <rect x="740" y="124" width="240" height="496" rx="10" fill="#f3faf6" stroke="#1f7a4d" stroke-width="1.5"/>
  <text x="860" y="148" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">AWS us-west-2 — DR</text>
  <rect x="756" y="164" width="208" height="92" rx="6" fill="#ffffff" stroke="#1f7a4d"/>
  <text x="860" y="186" font-size="12" font-weight="700" text-anchor="middle" fill="#14532d">Opção A — Velero</text>
  <text x="860" y="204" font-size="10" text-anchor="middle" fill="#14532d">bucket S3 versionado</text>
  <text x="860" y="219" font-size="10" text-anchor="middle" fill="#14532d">manifestos + volumes</text>
  <text x="860" y="234" font-size="10" text-anchor="middle" fill="#14532d">horário (apps) · diário (cluster)</text>
  <rect x="756" y="274" width="208" height="110" rx="6" fill="#ffffff" stroke="#1f7a4d"/>
  <text x="860" y="296" font-size="12" font-weight="700" text-anchor="middle" fill="#14532d">Opção B — warm standby</text>
  <text x="860" y="314" font-size="10" text-anchor="middle" fill="#14532d">os MESMOS módulos Terraform</text>
  <text x="860" y="329" font-size="10" text-anchor="middle" fill="#14532d">outra região, capacidade reduzida</text>
  <text x="860" y="344" font-size="10" text-anchor="middle" fill="#14532d">1 comando: make dr-up</text>
  <text x="860" y="366" font-size="10" text-anchor="middle" fill="#14532d">tag Role=warm-standby</text>
  <rect x="756" y="402" width="208" height="92" rx="6" fill="#0b2545"/>
  <text x="860" y="426" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Doações (crítico)</text>
  <text x="860" y="448" font-size="18" font-weight="700" text-anchor="middle" fill="#7fe0c0">RTO 1 h</text>
  <text x="860" y="474" font-size="18" font-weight="700" text-anchor="middle" fill="#7fe0c0">RPO 15 min</text>
  <text x="860" y="524" font-size="10" text-anchor="middle" fill="#14532d">Backup fora da região do cluster:</text>
  <text x="860" y="539" font-size="10" text-anchor="middle" fill="#14532d">sobrevive a falha regional</text>
  <path d="M700,380 C730,380 730,210 754,210" fill="none" stroke="#1f7a4d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#setaVerde)"/>
</svg>
