<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Ciclo de vida de um incidente na SolidaryTech</title>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d5a73"/>
    </marker>
    <marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>

  <text x="500" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#0b2545">Ciclo de vida do incidente — da detecção à comunicação</text>
  <text x="500" y="50" font-size="11" text-anchor="middle" fill="#4a5a6a">detecção preditiva e determinística em paralelo · mitigação antes do diagnóstico · todo "page" termina em post-mortem</text>

  <!-- 1. Deteccao: duas fontes -->
  <rect x="30" y="78" width="200" height="66" rx="7" fill="#f6f2fb" stroke="#6b4fa0"/>
  <text x="130" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#3f2a6b">1a · Preditiva (AIOps)</text>
  <text x="130" y="117" font-size="10" text-anchor="middle" fill="#3f2a6b">Datadog Watchdog: anomalia</text>
  <text x="130" y="131" font-size="10" text-anchor="middle" fill="#3f2a6b">de latência / erro / tráfego</text>

  <rect x="30" y="160" width="200" height="66" rx="7" fill="#eef2f7" stroke="#3d5a73"/>
  <text x="130" y="182" font-size="12" font-weight="700" text-anchor="middle" fill="#0b2545">1b · Determinística (SLO)</text>
  <text x="130" y="199" font-size="10" text-anchor="middle" fill="#0b2545">burn rate multi-janela do</text>
  <text x="130" y="213" font-size="10" text-anchor="middle" fill="#0b2545">error budget (Prometheus)</text>

  <!-- 2. Triagem -->
  <rect x="290" y="112" width="180" height="80" rx="7" fill="#ffffff" stroke="#3d5a73" stroke-width="1.4"/>
  <text x="380" y="136" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0b2545">2 · Triagem  (&lt; 1 min)</text>
  <text x="380" y="154" font-size="10" text-anchor="middle" fill="#4a5a6a">Alertmanager classifica:</text>
  <text x="380" y="169" font-size="10" text-anchor="middle" fill="#4a5a6a">page (queima rápida) ou</text>
  <text x="380" y="183" font-size="10" text-anchor="middle" fill="#4a5a6a">ticket (queima lenta)</text>
  <line x1="230" y1="111" x2="288" y2="140" stroke="#3d5a73" stroke-width="1.6" marker-end="url(#s)"/>
  <line x1="230" y1="193" x2="288" y2="166" stroke="#3d5a73" stroke-width="1.6" marker-end="url(#s)"/>

  <!-- 3. Notificacao em paralelo -->
  <rect x="530" y="78" width="200" height="148" rx="7" fill="#fff8ec" stroke="#b7791f" stroke-width="1.4"/>
  <text x="630" y="100" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7a4d0b">3 · Notificação paralela (10 s)</text>
  <rect x="546" y="112" width="168" height="30" rx="5" fill="#ffffff" stroke="#d9a44a"/>
  <text x="630" y="132" font-size="10.5" text-anchor="middle" fill="#7a4d0b">PagerDuty → plantonista (page)</text>
  <rect x="546" y="148" width="168" height="30" rx="5" fill="#ffffff" stroke="#d9a44a"/>
  <text x="630" y="168" font-size="10.5" text-anchor="middle" fill="#7a4d0b">ChatOps → canal + runbook</text>
  <rect x="546" y="184" width="168" height="30" rx="5" fill="#ffffff" stroke="#d9a44a"/>
  <text x="630" y="204" font-size="10.5" text-anchor="middle" fill="#7a4d0b">repository_dispatch → self-heal</text>
  <line x1="470" y1="152" x2="528" y2="152" stroke="#3d5a73" stroke-width="1.6" marker-end="url(#s)"/>

  <!-- 4. Mitigacao automatica -->
  <rect x="790" y="78" width="180" height="148" rx="7" fill="#eaf4ee" stroke="#1f7a4d" stroke-width="1.4"/>
  <text x="880" y="102" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14532d">4 · Mitigação (90 s)</text>
  <text x="880" y="120" font-size="10" text-anchor="middle" fill="#14532d">automática, antes do</text>
  <text x="880" y="134" font-size="10" text-anchor="middle" fill="#14532d">diagnóstico:</text>
  <text x="880" y="154" font-size="10" text-anchor="middle" fill="#14532d">rollout restart com</text>
  <text x="880" y="168" font-size="10" text-anchor="middle" fill="#14532d">allowlist de workloads ·</text>
  <text x="880" y="182" font-size="10" text-anchor="middle" fill="#14532d">ArgoCD selfHeal reverte</text>
  <text x="880" y="196" font-size="10" text-anchor="middle" fill="#14532d">drift de configuração</text>
  <line x1="730" y1="152" x2="788" y2="152" stroke="#3d5a73" stroke-width="1.6" marker-end="url(#s)"/>

  <!-- 5. Investigacao -->
  <rect x="790" y="276" width="180" height="96" rx="7" fill="#ffffff" stroke="#3d5a73" stroke-width="1.4"/>
  <text x="880" y="300" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0b2545">5 · Investigar / escalonar</text>
  <text x="880" y="318" font-size="10" text-anchor="middle" fill="#4a5a6a">trace no APM → mesmo</text>
  <text x="880" y="332" font-size="10" text-anchor="middle" fill="#4a5a6a">trace_id no Loki</text>
  <text x="880" y="350" font-size="10" text-anchor="middle" fill="#4a5a6a">não resolveu: on-call → tech</text>
  <text x="880" y="364" font-size="10" text-anchor="middle" fill="#4a5a6a">lead → arquiteto, a cada 15 min</text>
  <line x1="880" y1="226" x2="880" y2="274" stroke="#3d5a73" stroke-width="1.6" marker-end="url(#s)"/>

  <!-- 6. Resolucao -->
  <rect x="560" y="286" width="170" height="76" rx="7" fill="#ffffff" stroke="#3d5a73" stroke-width="1.4"/>
  <text x="645" y="310" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0b2545">6 · Resolução</text>
  <text x="645" y="328" font-size="10" text-anchor="middle" fill="#4a5a6a">correção via Git (PR)</text>
  <text x="645" y="342" font-size="10" text-anchor="middle" fill="#4a5a6a">SLI volta ao alvo e</text>
  <text x="645" y="356" font-size="10" text-anchor="middle" fill="#4a5a6a">o alerta resolve sozinho</text>
  <line x1="790" y1="324" x2="732" y2="324" stroke="#3d5a73" stroke-width="1.6" marker-end="url(#s)"/>

  <!-- 7. Post-mortem -->
  <rect x="330" y="286" width="170" height="76" rx="7" fill="#ffffff" stroke="#3d5a73" stroke-width="1.4"/>
  <text x="415" y="310" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0b2545">7 · Post-mortem</text>
  <text x="415" y="328" font-size="10" text-anchor="middle" fill="#4a5a6a">blameless, em até 48 h</text>
  <text x="415" y="342" font-size="10" text-anchor="middle" fill="#4a5a6a">timeline · causa raiz ·</text>
  <text x="415" y="356" font-size="10" text-anchor="middle" fill="#4a5a6a">ações com dono e prazo</text>
  <line x1="560" y1="324" x2="502" y2="324" stroke="#3d5a73" stroke-width="1.6" marker-end="url(#s)"/>

  <!-- 8. Comunicacao -->
  <rect x="30" y="276" width="240" height="96" rx="7" fill="#0b2545"/>
  <text x="150" y="300" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">8 · Comunicação</text>
  <text x="150" y="320" font-size="10" text-anchor="middle" fill="#dbe7f3">ONGs: impacto, duração, perda?</text>
  <text x="150" y="336" font-size="10" text-anchor="middle" fill="#dbe7f3">(crédito de serviço se violar SLA)</text>
  <text x="150" y="352" font-size="10" text-anchor="middle" fill="#dbe7f3">Diretoria: error budget e risco</text>
  <text x="150" y="366" font-size="10" text-anchor="middle" fill="#dbe7f3">Time: post-mortem + backlog</text>
  <line x1="330" y1="324" x2="272" y2="324" stroke="#3d5a73" stroke-width="1.6" marker-end="url(#s)"/>

  <!-- Realimentacao -->
  <path d="M30,324 C8,324 8,193 28,193" fill="none" stroke="#1f7a4d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#sv)"/>
  <text x="14" y="262" font-size="10" fill="#1f7a4d" transform="rotate(-90 14 262)" text-anchor="middle">realimenta regras</text>

  <!-- Faixa de politica -->
  <rect x="30" y="398" width="940" height="186" rx="8" fill="#f4f8fb" stroke="#b9c9d8"/>
  <text x="50" y="421" font-size="12.5" font-weight="700" fill="#0b2545">Severidade (docs/05-itsm-aiops, seção 3) — só P1 acorda alguém</text>
  <text x="50" y="442" font-size="10.5" fill="#1a1a1a"><tspan font-weight="700">P1 · page</tspan> — doador afetado agora (hot path fora ou burn rate 14,4×): PagerDuty + ChatOps + self-heal · resposta em 5 min</text>
  <text x="50" y="460" font-size="10.5" fill="#1a1a1a"><tspan font-weight="700">P2 · ticket</tspan> — degradação sem impacto imediato ou risco futuro: ChatOps · 4 h úteis</text>
  <text x="50" y="478" font-size="10.5" fill="#1a1a1a"><tspan font-weight="700">P3</tspan> — ruído, dívida técnica, alerta de capacidade: backlog da sprint</text>
  <text x="50" y="504" font-size="12" font-weight="700" fill="#0b2545">Error budget governa mudanças</text>
  <text x="50" y="523" font-size="10.5" fill="#1a1a1a">&gt; 80% consumido: congela deploys não críticos · 100%: congelamento total até o post-mortem · congelar mudança nunca desliga o self-heal</text>
  <text x="50" y="549" font-size="12" font-weight="700" fill="#0b2545">Medido no drill de 10/09/2026</text>
  <text x="50" y="568" font-size="10.5" fill="#1a1a1a">falha injetada 21:12:57 → alerta KubePodCrashLooping 21:14:13 = <tspan font-weight="700">MTTD de 76 s</tspan>, impacto zero ao doador (a readiness barrou o rollout quebrado)</text>
</svg>
