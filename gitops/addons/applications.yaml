# Todos os addons de plataforma, em um arquivo.
#
# Cada bloco segue o padrao MULTI-SOURCE do ArgoCD: o chart vem do repositorio
# oficial e os `values.yaml` deste repositorio Git. A configuracao fica
# versionada e revisavel em PR, sem manter um fork do chart.
#
# `__REPO_URL__` e substituido por `make configurar-repo`, que le a URL do
# remote do Git. Nao ha URL fixa aqui de proposito: cada grupo publica em seu
# proprio repositorio.
#
# SYNC-WAVES: o kube-prometheus-stack vai na onda -1 porque ele traz as CRDs
# ServiceMonitor e PrometheusRule. Os demais addons criam objetos DESSES tipos
# (ingress-nginx, opencost, velero, otel-gateway e a config de observabilidade)
# e falhariam com `no matches for kind "ServiceMonitor"` na primeira passada.
# Converge sozinho pela reconciliacao de 3 min, mas gera 10-20 minutos de
# vermelho no painel — pessimo justamente durante a gravacao do video.

# ------------------------------------------------- ingress-nginx (entrada)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.11.3
      helm:
        releaseName: ingress-nginx
        valueFiles: ["$values/gitops/addons/ingress-nginx/values.yaml"]
    - repoURL: __REPO_URL__
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions: ["CreateNamespace=true"]
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
---
# ------------------------------- kube-prometheus-stack (Prometheus/Grafana)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # Primeiro: instala as CRDs de que os outros addons dependem.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.5.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles: ["$values/gitops/addons/kube-prometheus-stack/values.yaml"]
    - repoURL: __REPO_URL__
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions:
      - CreateNamespace=true
      # Obrigatorio: a CRD do Prometheus passa de 262 KB e o apply client-side
      # falha com "metadata.annotations: Too long".
      - ServerSideApply=true
---
