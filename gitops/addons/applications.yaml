    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions: ["CreateNamespace=true"]
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
