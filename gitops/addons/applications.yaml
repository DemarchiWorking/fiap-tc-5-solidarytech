# ------------------------------- kube-prometheus-stack (Prometheus/Grafana)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # Primeiro: instala as CRDs de que os outros addons dependem.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 90.0.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles: ["$values/gitops/addons/kube-prometheus-stack/values.yaml"]
    - repoURL: https://github.com/DemarchiWorking/fiap-tc-5-solidarytech.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions:
      - CreateNamespace=true
      # Obrigatorio: a CRD do Prometheus passa de 262 KB e o apply client-side
      # falha com "metadata.annotations: Too long".
      - ServerSideApply=true
---
