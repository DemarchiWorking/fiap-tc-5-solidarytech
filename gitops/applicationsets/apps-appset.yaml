# ApplicationSet dos microsservicos.
#
# Gerador por diretorio: cada pasta que casar com apps/*/overlays/prod vira um
# Application automaticamente. Acrescentar um quarto microsservico ao projeto e
# criar a pasta e commitar — nenhum arquivo de ArgoCD precisa ser editado.
#
# E o mesmo padrao que a Fase 4 usou para os 5 servicos do ToggleMaster.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  # missingkey=error faz o template FALHAR se uma variavel nao existir, em vez
  # de gerar um Application com nome vazio — que e um erro silencioso e
  # dificil de diagnosticar.
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: https://github.com/DemarchiWorking/fiap-tc-5-solidarytech.git
        revision: HEAD
        directories:
          - path: gitops/apps/*/overlays/prod

  template:
    metadata:
      # path.segments = [gitops, apps, <servico>, overlays, prod]
      # indice 2 = o nome do servico
      name: "app-{{ index .path.segments 2 }}"
    spec:
      project: default

      source:
        repoURL: https://github.com/DemarchiWorking/fiap-tc-5-solidarytech.git
        targetRevision: HEAD
        path: "{{ .path.path }}"

      destination:
        server: https://kubernetes.default.svc
        namespace: "solidary-{{ index .path.segments 2 }}"

      # SEM isto o HPA nao funciona.
      #
      # `replicas: 2` esta declarado no Deployment base. Quando o HPA sobe para
      # 8 replicas no pico, o ArgoCD ve drift em /spec/replicas e reaplica 2; o
      # HPA sobe de novo, o ArgoCD derruba de novo. Flapping — e o maxReplicas
      # de 10 nunca e atingido de forma estavel, entao o teste de carga nao
      # produz a evidencia de rightsizing nem de SLO sob pico.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jqPathExpressions: ["$.spec.replicas"]

      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
        retry:
          # Os Jobs de init de banco podem falhar na primeira tentativa se o RDS
          # ainda estiver aceitando conexoes. Retry com backoff evita que o
          # Application fique Degraded por uma corrida de inicializacao.
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
