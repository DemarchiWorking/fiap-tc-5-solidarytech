# Roteamento por path atras do NLB compartilhado (ADR-002).
#
# UM load balancer serve todas as rotas por ~US$ 16/mes. Com o AWS Load Balancer
# Controller e um ALB por Ingress, seriam cinco — e o Controller nem funciona
# aqui, porque exige IRSA.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: donation-service
  annotations:
    # SEM rewrite-target aqui, de proposito.
    #
    # A versao anterior usava `rewrite-target: /$2` com path
    # `/donations(/|$)(.*)`. Como o prefixo do ingress e IGUAL a rota que a
    # aplicacao serve, o rewrite removia exatamente o que a app espera:
    # `POST /donations` chegava como `POST /` e devolvia 404. O teste de carga
    # k6 falhava inteiro e os paineis de SLO ficavam sem hot path.
    #
    # (O ngo-service funcionava por acidente: o prefixo dele e /ngo e a rota
    # e /ngos — diferentes, entao o rewrite acertava.)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /donations
            pathType: Prefix
            backend:
              service:
                name: donation-service
                port:
                  name: http
