# NetworkPolicy — mitigacao do ADR-001.
#
# Sem IRSA, todo pod do no alcanca a mesma credencial da LabRole. Nao da para
# resolver isso na camada de IAM (o lab bloqueia), entao a defesa desce para a
# camada de rede: cada namespace so aceita trafego do ingress e so fala com o
# que precisa.
#
# Nao substitui o menor privilegio de IAM. Reduz o alcance de um pod
# comprometido, e esta declarada como mitigacao parcial no PCN.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: donation-service
spec:
  podSelector:
    matchLabels:
      app: donation-service
  policyTypes: [Ingress, Egress]

  ingress:
    # So o ingress-nginx entra.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8082
    # Prometheus, restrito a porta do servico. Sem `ports` esta regra liberaria
    # TODAS as portas para qualquer pod de monitoring — amplo demais para uma
    # policy cuja razao de existir e limitar o alcance lateral.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8082

  egress:
    # DNS: sem isto o pod nao resolve nem o proprio Service.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # OTel Collector.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # RDS — vive DENTRO da VPC, nas subnets privadas.
    #
    # Esta regra e separada de proposito. A versao anterior tentava cobrir o
    # banco com `0.0.0.0/0 except 10.0.0.0/16`, mas o RDS esta em 10.0.32.0/20:
    # o proprio `except` anulava a permissao. O sintoma seria a readiness nunca
    # ficar pronta, com o diagnostico confuso de "o banco esta la, a tabela esta
    # la, e a app nao conecta" — porque os Jobs de init tem outro label e nao
    # sao selecionados por esta policy, entao o schema e criado normalmente.
    #
    # AS DUAS REGIOES, e nao so producao. As subnets privadas de us-east-1 sao
    # 10.0.32.0/20 e 10.0.48.0/20; as de us-west-2, 10.10.32.0/20 e
    # 10.10.48.0/20 (a VPC de DR e 10.10.0.0/16 — CIDR diferente de proposito,
    # para permitir peering entre as regioes).
    #
    # O ArgoCD do standby sincroniza ESTES MESMOS manifestos: o runbook de DR
    # manda rodar `AMBIENTE=dr-usw2 ./scripts/bootstrap-cluster.sh`, que aplica
    # o mesmo app-of-apps. Com apenas os blocos de producao aqui e a
    # NetworkPolicy de fato aplicada pelo VPC CNI, os pods do standby subiriam
    # sem conseguir falar com o RDS — no unico cenario em que o standby importa.
    #
    # Listar as quatro faixas e mais seguro do que alargar para 10.0.0.0/12:
    # continua negando todo o resto do espaco privado.
    - to:
        - ipBlock:
            cidr: 10.0.32.0/20
        - ipBlock:
            cidr: 10.0.48.0/20
        - ipBlock:
            cidr: 10.10.32.0/20
        - ipBlock:
            cidr: 10.10.48.0/20
      ports:
        - protocol: TCP
          port: 5432

    # Servicos AWS fora do cluster (SQS, DynamoDB, APM). O `except` mantem o
    # bloqueio de trafego lateral para dentro da VPC que nao tenha sido
    # explicitamente permitido acima.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/16
              # A VPC de DR tambem precisa constar: sem ela, o mesmo manifesto
              # aplicado no standby deixaria de bloquear o trafego lateral que
              # esta regra existe para bloquear.
              - 10.10.0.0/16
      ports:
        - protocol: TCP
          port: 443
    # IMDSv2 — unica fonte de credencial AWS dos pods (ADR-001).
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
