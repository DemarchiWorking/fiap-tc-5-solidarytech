# Teste de carga com k6 — gerador de evidência para três requisitos:
#
#   F1.2 (Dashboard SRE)  — sem tráfego, os painéis de SLO ficam vazios e a
#                           evidência do vídeo não existe;
#   F2.2 (Rightsizing)    — requests/limits só podem ser ajustados sobre uso
#                           REAL sob carga, nunca sobre um cluster ocioso;
#   F3.1 (AIOps)          — a IA do APM precisa de uma linha de base de
#                           comportamento normal para depois flagrar a anomalia.
#
# POR QUE É UM CronJob SUSPENSO, E NÃO UM Job.
#
# A primeira versão deste arquivo era um Job com `suspend: true`, disparado por
# `kubectl patch ... suspend=false`. Isso NÃO funciona sob GitOps: o ArgoCD tem
# `selfHeal: true`, vê o campo divergindo do Git e reverte o patch em segundos.
# O teste nunca chegaria a rodar.
#
# Com um CronJob suspenso, o disparo cria um Job NOVO:
#
#     kubectl -n solidary-loadtest create job --from=cronjob/k6-load-test \
#       k6-run-$(date +%s)
#
# Esse Job não carrega os rótulos de rastreamento do ArgoCD, então ele não é
# gerenciado nem podado — roda até o fim, deixa os logs e sai. É o `make carga`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k6-load-test
spec:
  # Suspenso permanentemente. Ele é um TEMPLATE de execução sob demanda, não uma
  # rotina agendada: carga contínua queimaria crédito e poluiria os SLIs com
  # tráfego sintético, o que tornaria o error budget do relatório inútil.
  suspend: true
  schedule: "0 0 31 2 *"   # 31 de fevereiro — nunca ocorre
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: k6-load-test
        spec:
          restartPolicy: Never
          containers:
            - name: k6
              image: grafana/k6:0.55.0
              command: ["k6", "run", "/scripts/carga.js"]

              env:
                # Alcança o ingress-nginx por DNS interno: o teste passa pelo
                # MESMO caminho do tráfego real (ingress → service → pod), e não
                # por um atalho direto ao pod. Testar o atalho mediria uma coisa
                # que usuário nenhum experimenta.
                - name: BASE_URL
                  value: "http://ingress-nginx-controller.ingress-nginx.svc.cluster.local"

              volumeMounts:
                - name: scripts
                  mountPath: /scripts

              resources:
                requests:
                  cpu: 300m
                  memory: 256Mi
                limits:
                  # k6 é o gerador de carga: se ele mesmo for estrangulado por
                  # CPU, a carga fica abaixo do alvo e o teste mede o k6, não o
                  # sistema.
                  cpu: 1000m
                  memory: 512Mi

          volumes:
            - name: scripts
              configMap:
                name: k6-scripts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-scripts
data:
  carga.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import { Rate, Trend } from 'k6/metrics';

    // Métricas próprias, separadas por endpoint. A métrica agregada do k6
    // esconderia uma degradação do hot path atrás da média dos outros.
    const errosDoacao = new Rate('erros_doacao');
    const latenciaDoacao = new Trend('latencia_doacao');

    export const options = {
      scenarios: {
        // Cenário 1 — leitura. Doadores navegando pelas ONGs.
        navegacao: {
          executor: 'ramping-vus',
          startVUs: 0,
          stages: [
            { duration: '1m', target: 20 },
            { duration: '3m', target: 20 },
            { duration: '1m', target: 0 },
          ],
          exec: 'navegar',
        },

        // Cenário 2 — o HOT PATH. Começa depois, para que o pico de doação caia
        // sobre um sistema JÁ sob carga de leitura. Um pico em sistema ocioso
        // não reproduz o cenário do enunciado ("destaque em rede nacional gerou
        // picos imprevisíveis").
        doacoes: {
          executor: 'ramping-arrival-rate',
          startRate: 5,
          timeUnit: '1s',
          preAllocatedVUs: 20,
          maxVUs: 100,
          startTime: '1m',
          stages: [
            { duration: '2m', target: 30 },   // subida
            { duration: '1m', target: 80 },   // PICO — dispara o HPA
            { duration: '1m', target: 10 },   // queda
          ],
          exec: 'doar',
        },
      },

      // Estes são limiares de TESTE DE ESTRESSE (achar o ponto de ruptura),
      // deliberadamente mais frouxos que os SLOs de produção.
      //
      // O SLO de latência NÃO é "p95 < 300ms" — docs/03-sre/sli-slo-sla.md gasta
      // um parágrafo rejeitando essa formulação, porque percentil é uma média
      // disfarçada e esconde a cauda. O SLO implementado é "99% das requisições
      // abaixo de 300 ms", medido por proporção de bucket, e o de erro é
      // 99,9% de sucesso. Confundir os dois faria o teste "aprovar" um sistema
      // que viola o SLO.
      thresholds: {
        'http_req_duration{scenario:doacoes}': ['p(95)<2000', 'p(99)<3000'],
        'erros_doacao': ['rate<0.05'],
        'http_req_failed': ['rate<0.05'],
      },
    };

    export function navegar() {
      const r = http.get(`${__ENV.BASE_URL}/ngo/ngos`);
      check(r, { 'listagem de ONGs devolveu 200': (res) => res.status === 200 });
      sleep(1);
    }

    export function doar() {
      const payload = JSON.stringify({
        ngo_id: Math.floor(Math.random() * 2) + 1,
        amount: Math.round((Math.random() * 500 + 10) * 100) / 100,
        donor_name: `Doador ${Math.floor(Math.random() * 100000)}`,
      });

      const r = http.post(`${__ENV.BASE_URL}/donations`, payload, {
        headers: { 'Content-Type': 'application/json' },
      });

      const ok = check(r, { 'doacao criada (201)': (res) => res.status === 201 });
      errosDoacao.add(!ok);
      latenciaDoacao.add(r.timings.duration);
    }
