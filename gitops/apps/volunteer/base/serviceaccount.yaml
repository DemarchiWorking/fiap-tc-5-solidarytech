# ServiceAccount sem anotacao de IRSA.
#
# Numa conta AWS normal, aqui haveria
# `eks.amazonaws.com/role-arn: arn:aws:iam::...:role/volunteer-service` e o pod teria
# uma role de menor privilegio so sua. O AWS Academy Learner Lab bloqueia a
# criacao do OIDC provider, entao a credencial vem do IMDS do no (ADR-001).
#
# A ServiceAccount existe assim mesmo para que a migracao para IRSA, numa conta
# real, seja acrescentar uma anotacao — e nada mais.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volunteer-service
automountServiceAccountToken: false
