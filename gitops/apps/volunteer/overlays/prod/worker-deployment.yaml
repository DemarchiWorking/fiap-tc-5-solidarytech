# volunteer-worker — consumidor da fila de eventos de doacao.
#
# MESMA IMAGEM do volunteer-service, apenas com `command` diferente. Isso
# significa um build, um scan de seguranca e uma tag de imagem a menos para
# manter em sincronia — e garante que API e worker nunca divirjam de versao,
# que e uma classe inteira de bug de deploy eliminada.
#
# O worker nao existe no codigo original do enunciado. Foi acrescentado porque o
# donation-service publica em SQS e NADA consumia a fila. Sem consumidor:
#   * o trace distribuido terminava no produtor — o requisito F0.5b nao seria
#     demonstravel de verdade;
#   * a DLQ nunca receberia nada;
#   * o SLI de frescor da fila (F1.1a) nao teria significado, porque a idade da
#     mensagem cresceria para sempre.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer-worker
  labels:
    app: volunteer-worker
    app.kubernetes.io/name: volunteer-worker
    app.kubernetes.io/component: consumidor-de-eventos
spec:
  # UMA replica, de proposito. O SQS entrega at-least-once e sem ordenacao
  # garantida: com duas replicas, o mesmo evento pode ser processado duas vezes
  # em paralelo. O processamento e idempotente, mas duplicar trabalho para
  # consumir uma fila de baixo volume nao compra nada.
  #
  # Se a fila crescer, o caminho e o KEDA escalando por profundidade de fila —
  # nao replicas fixas. Registrado como evolucao no roadmap.
  replicas: 1

  strategy:
    # Recreate, e nao RollingUpdate: durante um rollout com duas versoes ativas,
    # ambas consumiriam a mesma fila. Preferimos alguns segundos sem consumo
    # (o SLI de frescor tolera 60s) a duas versoes concorrendo.
    type: Recreate

  selector:
    matchLabels:
      app: volunteer-worker

  template:
    metadata:
      labels:
        app: volunteer-worker
        app.kubernetes.io/name: volunteer-worker
    spec:
      serviceAccountName: volunteer-service
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: worker
          image: volunteer-service:latest
          imagePullPolicy: IfNotPresent

          # A unica diferenca em relacao a API.
          command: ["python", "worker.py"]

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          env:
            - name: DEPLOYMENT_ENVIRONMENT
              value: "prod"
            - name: SERVICE_VERSION
              value: "prod"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef: { name: solidary-infra, key: aws_region }
            - name: AWS_SQS_URL
              valueFrom:
                configMapKeyRef: { name: solidary-infra, key: sqs_url }
            - name: AWS_DYNAMODB_TABLE
              valueFrom:
                configMapKeyRef: { name: solidary-infra, key: dynamodb_table }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "volunteer-worker"

          # Probes por HEARTBEAT, nao por HTTP.
          #
          # O worker nao escuta porta, entao httpGet nao se aplica. A versao
          # anterior nao tinha probe nenhuma, com a justificativa de que a
          # metrica solidary_donation_events_processed_total e o SLI de frescor
          # da fila ja observam a saude dele. Observam mesmo — mas observar e
          # ALERTAR, e alerta acorda uma pessoa. Probe RECUPERA sozinha, sem
          # ninguem no meio. Sao camadas diferentes, e faltava a de baixo.
          #
          # A objecao original ao exec continua valida e e o que define o
          # desenho: `pgrep -f worker.py` provaria apenas que o processo
          # existe, e um worker travado em I/O tambem existe. Por isso a probe
          # nao pergunta "o processo esta vivo?" e sim "o laco girou ha pouco?"
          # — o worker escreve /tmp/worker-heartbeat a cada volta e
          # `worker.py --probe` confere a idade do arquivo. Travou no meio de
          # uma chamada ao DynamoDB? O arquivo envelhece e o pod reinicia.
          #
          # O batimento acontece TAMBEM nos ramos de erro tratado: fila
          # indisponivel nao e worker travado, e reiniciar o pod nao traria a
          # fila de volta.
          startupProbe:
            exec:
              command: ["python", "worker.py", "--probe"]
            # 30 x 5s = ate 150s para o primeiro batimento. Cobre a resolucao
            # de credencial pelo IMDS e a criacao do cliente boto3, que na
            # primeira chamada busca metadados da instancia.
            periodSeconds: 5
            failureThreshold: 30
            # timeoutSeconds EXPLICITO. O default do Kubernetes e 1s, e cada
            # tentativa aqui paga um interpretador Python novo importando
            # boto3 e o OpenTelemetry — nunca cabe em um segundo. Sem esta
            # linha, TODA tentativa expirava:
            #
            #   Startup probe failed: command timed out:
            #   "python worker.py --probe" timed out after 1s
            #
            # O container era morto antes de ficar pronto, em laco: 15
            # reinicios seguidos. O generoso failureThreshold acima nao ajuda
            # em nada quando o que falha e o relogio de CADA tentativa. Vale o
            # mesmo 10s da liveness logo abaixo, que ja tinha o campo.
            timeoutSeconds: 10

          livenessProbe:
            exec:
              command: ["python", "worker.py", "--probe"]
            periodSeconds: 30
            timeoutSeconds: 10
            # 3 falhas x 30s = 90s de tolerancia ALEM dos 90s de
            # HEARTBEAT_TIMEOUT do proprio worker. Conservador de proposito:
            # reiniciar um worker saudavel devolve as mensagens em voo para a
            # fila e piora justamente a latencia que a probe deveria proteger.
            failureThreshold: 3

          # Dimensionado pela MEDICAO, com carga rodando — nao por estimativa.
          #
          # O request era 50m. Sob o pico do k6, o HPA leu 404% de utilizacao,
          # ou seja ~200m por pod: o request estava quatro vezes abaixo do uso
          # real. Isso nao aparece como erro em lugar nenhum — o pod nao e
          # morto, porque o LIMIT (300m) nao era atingido. O que se degrada e o
          # AGENDAMENTO: o scheduler acreditava que quatro workers custavam
          # 200m quando custavam 800m, e podia empilha-los num no que nao
          # aguentava.
          #
          # 100m e o meio termo defensavel: o dobro do uso em regime (1-10m em
          # ociosidade, ~67m no pod mais quente logo apos o pico) e metade do
          # pico. Deixa o HPA com espaco para reagir — com request igual ao
          # pico, a utilizacao nunca passaria de 100% e o HPA nunca escalaria.
          #
          # Memoria medida: 57-59Mi por pod, estavel. O request de 96Mi ja
          # estava correto e nao muda.
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 400m
              memory: 256Mi

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }

      # 40s: o long polling do SQS bloqueia por ate 20s, e o lote em andamento
      # precisa terminar antes do processo sair. Encerrar no meio devolveria as
      # mensagens a fila (correto, mas gera retrabalho a cada deploy).
      terminationGracePeriodSeconds: 40
